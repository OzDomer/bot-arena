name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: bots_arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d bots_arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install deps
        run: npm ci

      - name: type check sim
        run: npx tsc -p sim

      - name: type check backend
        run: npx tsc -p backend

      - name: type check frontend
        run: npx tsc -p frontend

      - name: lint
        run: npm run lint

      - name: test
        run: npx vitest run

      - name: test db
        run: npm run test:db

      - name: build
        run: npm run build

  images:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/ozdomer/bot-arena-backend:main
            ghcr.io/ozdomer/bot-arena-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/OzDomer/bot-arena
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: VITE_API_URL=https://arena-api.domer.dev
          tags: |
            ghcr.io/ozdomer/bot-arena-frontend:main
            ghcr.io/ozdomer/bot-arena-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/OzDomer/bot-arena
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
